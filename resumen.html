<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu resumen discovery — Tres65 Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --profundo:#1A4F5C;
    --acento:#2AA898;
    --medio:#1E7A6E;
    --marfil:#FFFFFF;
    --menta:#E8F4F1;
    --texto:#22383B;
    --texto-suave:#5C7274;
    --borde:#D9E4E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--marfil);
    font-family:'Raleway',sans-serif;
    color:var(--texto);
    line-height:1.6;
  }
  .wrap{max-width:520px;margin:0 auto;padding:32px 20px 80px;}
  header{text-align:center;margin-bottom:32px;}
  header .logo{display:block; max-width:200px; margin:0 auto 36px;}
  header h1{
    font-family:'Montserrat',sans-serif;
    font-size:22px;
    font-weight:600;
    color:var(--profundo);
    margin:0 0 8px;
  }
  header p{color:var(--texto-suave); font-size:14px; margin:0;}

  .report-text{
    font-size:14px;
    line-height:1.7;
    color:var(--texto);
    background:#fff;
    border:1px solid var(--borde);
    border-radius:8px;
    padding:16px;
    margin-bottom:16px;
    white-space:pre-line;
  }
  .report-text strong{color:var(--profundo);}

  .empty-note{
    font-size:13px;
    color:var(--texto-suave);
    padding:12px 16px;
    background:var(--menta);
    border-radius:8px;
    text-align:center;
  }

  .back-link{
    display:block;
    text-align:center;
    margin-top:24px;
    font-size:13px;
    color:var(--texto-suave);
    text-decoration:underline;
  }
  .new-property-btn{
    display:block;
    width:100%;
    margin-top:8px;
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:14px;
    border-radius:8px;
    border:none;
    background:var(--profundo);
    color:#fff;
    cursor:pointer;
  }
  .new-property-btn:hover{background:var(--medio);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="LOGO_INMOBILIARIA_3.png" alt="Tres65 Inmobiliaria" class="logo">
    <h1 id="page-title">Tu resumen discovery</h1>
    <p>Esto es lo que compartimos con tu agente después de tu cuestionario.</p>
  </header>

  <div id="content"></div>

  <button class="new-property-btn" id="new-property-btn" type="button" style="display:none;">Llenar cuestionario para otra propiedad</button>

  <a class="back-link" href="home.html">Regresar a tu progreso</a>
</div>

<script type="module" src="firebase-sync.js"></script>
<script>
function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderReportHtml(text){
  return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function waitForSync(){
  return new Promise(resolve=>{
    if(window.tres65Sync){ resolve(); return; }
    window.addEventListener('tres65-sync-ready', () => resolve(), {once:true});
  });
}

(async function boot(){
  await waitForSync();
  const clientToken = new URLSearchParams(window.location.search).get('client') || localStorage.getItem('tres65_client_token');
  if(new URLSearchParams(window.location.search).get('client')) localStorage.setItem('tres65_client_token', clientToken);
  const uid = await window.tres65Sync.init(clientToken);
  if(uid) await window.tres65Sync.pull(uid);

  const params = new URLSearchParams(window.location.search);
  const property = params.get('property') || localStorage.getItem('tres65_active_property') || '1';
  const saved = localStorage.getItem('tres65_property_' + property + '_report') || localStorage.getItem('tres65_last_report');
  const content = document.getElementById('content');
  if(property !== '1'){
    document.getElementById('page-title').textContent = 'Tu resumen discovery — Propiedad ' + property;
  }
  if(saved){
    const div = document.createElement('div');
    div.className = 'report-text';
    div.innerHTML = renderReportHtml(saved);
    content.appendChild(div);
    document.getElementById('new-property-btn').style.display = 'block';
  } else {
    content.innerHTML = '<p class="empty-note">Todavía no tienes un resumen generado. Completa el cuestionario de discovery para verlo aquí.</p>';
  }
})();

document.getElementById('new-property-btn').addEventListener('click', ()=>{
  const count = parseInt(localStorage.getItem('tres65_property_count') || '1', 10);
  const newId = count + 1;
  // Por si quedó algo de pruebas anteriores con este mismo número, empieza limpio.
  localStorage.removeItem('tres65_property_' + newId + '_state');
  localStorage.removeItem('tres65_property_' + newId + '_report');
  localStorage.setItem('tres65_property_count', String(newId));
  localStorage.setItem('tres65_active_property', String(newId));
  window.location.href = 'index.html?property=' + newId;
});
</script>
</body>
</html>
