<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu progreso — Tres65 Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --profundo:#1A4F5C;
    --acento:#2AA898;
    --medio:#1E7A6E;
    --marfil:#FFFFFF;
    --menta:#E8F4F1;
    --texto:#22383B;
    --texto-suave:#5C7274;
    --borde:#D9E4E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--marfil);
    font-family:'Raleway',sans-serif;
    color:var(--texto);
    line-height:1.6;
  }
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 80px;}
  header{text-align:center;margin-bottom:32px;}
  header .logo{display:block; max-width:220px; margin:0 auto 20px;}
  header h1{
    font-family:'Montserrat',sans-serif;
    font-size:24px;
    font-weight:600;
    color:var(--profundo);
    margin:0 0 8px;
  }
  header p{color:var(--texto-suave); font-size:14px; margin:0;}
  .pending-note{
    font-size:13px;
    color:var(--texto-suave);
    margin:0 0 24px;
    padding:12px 16px;
    background:var(--menta);
    border-radius:8px;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="LOGO_INMOBILIARIA_3.png" alt="Tres65 Inmobiliaria" class="logo">
    <h1>Tu progreso</h1>
    <p>Aquí vas a poder ver en qué paso vas de tu proceso con nosotros.</p>
  </header>
  <p class="pending-note">Estamos armando esta página. Muy pronto vas a poder ver aquí todos los pasos de tu proceso.</p>
</div>
</body>
</html>
