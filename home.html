<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu progreso — Tres65 Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --profundo:#1A4F5C;
    --acento:#2AA898;
    --medio:#1E7A6E;
    --marfil:#FFFFFF;
    --menta:#E8F4F1;
    --texto:#22383B;
    --texto-suave:#5C7274;
    --borde:#D9E4E1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--marfil);
    font-family:'Raleway',sans-serif;
    color:var(--texto);
    line-height:1.6;
  }
  .wrap{max-width:520px;margin:0 auto;padding:32px 20px 80px; transition:max-width .2s ease;}
  .wrap.multi{max-width:1100px;}
  .properties-row{display:flex; gap:32px; flex-wrap:wrap; justify-content:center; align-items:flex-start;}
  .property-col{flex:1 1 380px; max-width:460px;}
  .property-label{
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--acento);
    text-transform:uppercase;
    letter-spacing:1px;
    text-align:center;
    margin-bottom:16px;
  }
  header{text-align:center;margin-bottom:32px;}
  header .logo{display:block; max-width:220px; margin:0 auto 36px;}
  header h1{
    font-family:'Montserrat',sans-serif;
    font-size:24px;
    font-weight:600;
    color:var(--profundo);
    margin:0 0 8px;
  }
  header p{color:var(--texto-suave); font-size:14px; margin:0;}

  .stepper{display:flex; flex-direction:column; align-items:center;}
  .step-arrow{color:var(--borde); margin:2px 0;}
  .step-arrow svg{display:block; width:20px; height:20px;}

  .step-card{
    width:100%;
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px;
    border-radius:14px;
    position:relative;
  }
  a.step-card{text-decoration:none; cursor:pointer;}
  .step-card.done{color:#fff;}
  .step-card.done .step-sub{color:rgba(255,255,255,.75);}
  .step-card.done .step-divider{background:#fff; opacity:.3;}

  .step-card.pending{
    background:#fff;
    border:1px solid var(--borde);
    color:var(--texto-suave);
    cursor:not-allowed;
    transition:background .15s ease;
  }
  .step-card.pending:hover{background:var(--menta);}
  .step-card.pending:hover::after{
    content: attr(data-tooltip);
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%);
    margin-top:6px;
    background:var(--profundo);
    color:#fff;
    font-size:11px;
    line-height:1.4;
    padding:8px 12px;
    border-radius:6px;
    width:220px;
    text-align:center;
    z-index:5;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
  }
  .step-card.pending .step-title{color:var(--texto-suave);}
  .step-card.pending .step-icon{color:#B9C6C4;}
  .step-card.pending .step-divider{background:var(--borde);}

  .step-icon{width:34px; height:34px; flex-shrink:0;}
  .step-divider{width:1px; align-self:stretch;}
  .step-num{font-family:'Montserrat',sans-serif; font-size:24px; font-weight:300; flex-shrink:0;}
  .step-text{flex:1; min-width:0;}
  .step-title{font-family:'Montserrat',sans-serif; font-size:16px; font-weight:600; line-height:1.25;}
  .step-sub{font-size:12px; margin-top:2px;}

  .step-wa{
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .logout-btn{
    display:block;
    width:100%;
    margin-top:32px;
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:12px;
    border-radius:8px;
    border:1px solid var(--borde);
    background:transparent;
    color:var(--texto-suave);
    cursor:pointer;
  }
  .logout-btn:hover{border-color:var(--acento); color:var(--acento);}

  .property-step{
    flex-direction:column;
    align-items:stretch;
    gap:10px;
    background:#B2543D;
    color:#fff;
    cursor:default;
  }
  .property-step-label{display:flex; align-items:center; gap:8px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px;}
  .property-step-label i{width:18px; height:18px; flex-shrink:0;}
  .property-carousel{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin:0 -4px;}
  .property-carousel img{height:120px; width:auto; border-radius:8px; flex-shrink:0;}
  .property-step-title{font-family:'Montserrat',sans-serif; font-size:16px; font-weight:600;}
  .property-step-details{font-size:13px; opacity:.9;}
  .property-step-link{color:#fff; font-size:13px; text-decoration:underline; align-self:flex-start;}

  .property-step.discarded{
    background:#fff;
    border:1px solid var(--borde);
    color:var(--texto-suave);
    cursor:pointer;
  }
  .property-step.discarded .property-step-label{color:var(--texto-suave);}
  .property-step.discarded .property-step-title{color:var(--texto-suave); text-decoration:line-through;}
  .property-step-reason{
    display:none;
    font-size:13px;
    background:var(--menta);
    border-radius:8px;
    padding:10px 12px;
    color:var(--texto);
  }
  .property-step.discarded.open .property-step-reason{display:block;}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <img src="LOGO_INMOBILIARIA_3.png" alt="Tres65 Inmobiliaria" class="logo">
    <h1>Tu progreso</h1>
    <p>Aquí puedes ver en qué paso vas de tu proceso con nosotros.</p>
  </header>

  <div class="properties-row" id="properties-row"></div>

  <button class="logout-btn" id="logout-btn" type="button">Cerrar sesión</button>
</div>

<script>
const WHATSAPP_ICON = '<svg viewBox="0 0 24 24" fill="#fff" width="20" height="20"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.79.47 3.53 1.36 5.07L2 22l5.19-1.44a9.87 9.87 0 0 0 4.85 1.28h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm.01 1.67c2.21 0 4.28.86 5.84 2.42a8.2 8.2 0 0 1 2.42 5.83c0 4.55-3.71 8.26-8.27 8.26a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.08.86.82-3.01-.19-.3a8.18 8.18 0 0 1-1.26-4.38c0-4.56 3.71-8.35 8.21-8.35zm-4.5 4.51c-.15 0-.4.06-.61.29-.21.24-.8.78-.8 1.9s.82 2.21.93 2.36c.11.15 1.6 2.51 3.93 3.42 1.94.76 2.34.61 2.76.57.42-.04 1.35-.55 1.54-1.08.19-.53.19-.98.13-1.08-.06-.1-.21-.16-.44-.27-.23-.12-1.35-.67-1.56-.74-.21-.08-.36-.12-.51.12-.15.24-.59.74-.72.89-.13.15-.27.17-.5.06-.23-.12-.98-.36-1.87-1.15-.69-.62-1.16-1.38-1.29-1.62-.13-.24-.01-.36.1-.48.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.51-1.24-.71-1.7-.19-.45-.38-.39-.51-.4-.13-.01-.28-.01-.43-.01z"/></svg>';

const API_BASE = 'https://agente-tres65-production.up.railway.app';

const clientToken = new URLSearchParams(window.location.search).get('client');
if(clientToken) localStorage.setItem('tres65_client_token', clientToken);
const activeToken = clientToken || localStorage.getItem('tres65_client_token');
const agentHref = activeToken ? ('agente.html?client=' + activeToken) : 'agente.html';

function fmtMoney(n){
  return '$' + Number(n).toLocaleString('es-MX', {maximumFractionDigits:0});
}

function buildPropertyStepCard(ficha){
  const discarded = !!ficha.property_discarded;
  const p = ficha.property;
  const card = document.createElement('div');
  card.className = 'step-card property-step' + (discarded ? ' discarded' : '');

  const label = document.createElement('div');
  label.className = 'property-step-label';
  label.innerHTML = '<i data-lucide="home"></i> ' + (discarded ? 'Propiedad descartada' : 'Propiedad de tu interés');
  card.appendChild(label);

  if(p && p.images && p.images.length && !discarded){
    const carousel = document.createElement('div');
    carousel.className = 'property-carousel';
    p.images.forEach(url=>{
      const img = document.createElement('img');
      img.src = url;
      img.alt = p.title || 'Propiedad';
      carousel.appendChild(img);
    });
    card.appendChild(carousel);
  }

  const title = document.createElement('div');
  title.className = 'property-step-title';
  title.textContent = (p && p.title) || ficha.property_raw || 'Propiedad';
  card.appendChild(title);

  if(p && !discarded){
    const details = document.createElement('div');
    details.className = 'property-step-details';
    const bits = [];
    if(p.price) bits.push(fmtMoney(p.price));
    if(p.m2_price) bits.push(fmtMoney(p.m2_price) + '/m²');
    if(p.bedrooms) bits.push(p.bedrooms + ' rec');
    if(p.bathrooms) bits.push(p.bathrooms + ' baños');
    if(p.construction_size) bits.push(p.construction_size + ' m²');
    details.textContent = bits.join(' · ');
    card.appendChild(details);
  }

  if(!discarded){
    const link = document.createElement('a');
    link.className = 'property-step-link';
    link.href = (p && p.public_url) || ficha.property_raw || '#';
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'Ver ficha completa';
    card.appendChild(link);
  } else {
    const reason = document.createElement('div');
    reason.className = 'property-step-reason';
    reason.textContent = ficha.discard_reason || 'Tu agente no dio un motivo específico.';
    card.appendChild(reason);
    card.addEventListener('click', ()=>{ card.classList.toggle('open'); });
  }

  return card;
}

const metAgent = localStorage.getItem('tres65_met_agent') === 'true';
const propertyCount = parseInt(localStorage.getItem('tres65_property_count') || '1', 10);
const colors = ['#1A4F5C', '#2AA898'];

function stepsForProperty(propertyId, blocking){
  const hasReport = !!localStorage.getItem('tres65_property_' + propertyId + '_report');
  const cuestionarioDone = blocking ? false : metAgent;
  const resumenDone = blocking ? false : hasReport;
  const blockedTip = 'Tu agente te va a contactar sobre la propiedad que ya tiene en mente primero';
  return [
    {num:1, title:'Conoce a tu agente', sub:'Agencia + trayectoria', icon:'user-check', done:true, href:agentHref, whatsapp:true},
    {num:2, title:'Cuestionario de discovery', sub:'Conocer al cliente', icon:'clipboard-check', done:cuestionarioDone, href:(hasReport ? 'resumen.html?property=' : 'index.html?property=') + propertyId, tooltip: blocking ? blockedTip : 'Se desbloquea cuando conozcas a tu agente'},
    {num:3, title:'Resumen discovery', sub:'Tu perfil de cliente', icon:'file-text', done:resumenDone, href:'resumen.html?property=' + propertyId, tooltip: blocking ? blockedTip : 'Se desbloquea cuando completes el cuestionario de discovery'},
    {num:4, title:'Tu agente está trabajando en tus propiedades', sub:'Buscando las mejores opciones para ti', icon:'search', done:false, tooltip:'Se desbloquea cuando tu agente empiece a trabajar en tu búsqueda'},
    {num:5, title:'Ficha pre-tour', sub:'Opciones de propiedades a visitar', icon:'clipboard-list', done:false, tooltip:'Se desbloquea cuando tu agente tenga propiedades listas para comparar'},
    {num:6, title:'Tour de casas', sub:'Visita a propiedades', icon:'home', done:false, tooltip:'Se desbloquea cuando agendes tu primer tour'},
    {num:7, title:'Análisis post-tour', sub:'Ajuste de opciones', icon:'bar-chart-3', done:false, tooltip:'Se desbloquea después de tu tour de propiedades'},
    {num:8, title:'Guía de compra', sub:'Siguientes pasos', icon:'key-round', done:false, tooltip:'Se desbloquea cuando elijas tu propiedad'},
    {num:9, title:'Guía del comprador', sub:'Todo lo que necesitas saber', icon:'book-open', done:false, tooltip:'Se desbloquea en la etapa final de tu compra'}
  ];
}

function buildStepCard(s){
  const card = document.createElement(s.done ? 'a' : 'div');
  card.className = 'step-card ' + (s.done ? 'done' : 'pending');
  if(s.done){
    card.href = s.href;
    card.style.background = colors[(s.num - 1) % 2];
  } else {
    card.setAttribute('data-tooltip', s.tooltip || 'Se desbloqueará cuando llegues a este paso');
  }

  const icon = document.createElement('i');
  icon.setAttribute('data-lucide', s.icon);
  icon.className = 'step-icon';
  card.appendChild(icon);

  const divider = document.createElement('span');
  divider.className = 'step-divider';
  card.appendChild(divider);

  const num = document.createElement('span');
  num.className = 'step-num';
  num.textContent = s.num + '.';
  card.appendChild(num);

  const text = document.createElement('div');
  text.className = 'step-text';
  const title = document.createElement('div');
  title.className = 'step-title';
  title.textContent = s.title;
  const sub = document.createElement('div');
  sub.className = 'step-sub';
  sub.textContent = s.sub;
  text.appendChild(title);
  text.appendChild(sub);
  card.appendChild(text);

  if(s.whatsapp){
    const wa = document.createElement('a');
    wa.className = 'step-wa';
    wa.href = 'https://wa.me/5219992786153?text=' + encodeURIComponent('Hola, me gustaría platicar sobre mi búsqueda de propiedad');
    wa.target = '_blank';
    wa.rel = 'noopener';
    wa.innerHTML = WHATSAPP_ICON;
    wa.addEventListener('click', e=>{ e.stopPropagation(); });
    card.appendChild(wa);
  }

  return card;
}

function renderStepper(container, cards){
  cards.forEach((c, i)=>{
    container.appendChild(c.special === 'property' ? buildPropertyStepCard(c.ficha) : buildStepCard(c));
    if(i < cards.length - 1){
      const arrow = document.createElement('div');
      arrow.className = 'step-arrow';
      arrow.innerHTML = '<i data-lucide="chevron-down"></i>';
      container.appendChild(arrow);
    }
  });
}

async function init(){
  let ficha = null;
  if(activeToken){
    try{
      const res = await fetch(API_BASE + '/portal/ficha/' + activeToken);
      const data = await res.json();
      if(data.ok) ficha = data.ficha;
    }catch(e){ console.error('[Home] error consultando ficha:', e); }
  }

  const propertiesRow = document.getElementById('properties-row');
  if(propertyCount > 1) document.getElementById('wrap').classList.add('multi');

  for(let p = 1; p <= propertyCount; p++){
    const col = document.createElement('div');
    col.className = 'property-col';

    if(propertyCount > 1){
      const label = document.createElement('div');
      label.className = 'property-label';
      label.textContent = 'Propiedad ' + p;
      col.appendChild(label);
    }

    const hasProperty = p === 1 && ficha && (ficha.property || ficha.property_raw);
    const blocking = hasProperty && !ficha.property_discarded;
    const cards = stepsForProperty(p, blocking);
    if(hasProperty) cards.splice(1, 0, {special:'property', ficha});

    const stepperEl = document.createElement('div');
    stepperEl.className = 'stepper';
    col.appendChild(stepperEl);

    renderStepper(stepperEl, cards);
    propertiesRow.appendChild(col);
  }

  document.getElementById('logout-btn').addEventListener('click', ()=>{
    window.location.href = 'login.html';
  });

  if(window.lucide) lucide.createIcons();
}

init();
</script>
</body>
</html>
