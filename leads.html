<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads del día — Tres65 Inmobiliaria</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tres65">
<meta name="theme-color" content="#1A4F5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script type="module" src="firebase-sync.js"></script>
<style>
  :root{
    --profundo:#1A4F5C;
    --acento:#2AA898;
    --medio:#1E7A6E;
    --marfil:#FFFFFF;
    --menta:#E8F4F1;
    --texto:#22383B;
    --texto-suave:#5C7274;
    --borde:#D9E4E1;
    --alerta:#C97A3D;
    --alerta-bg:#FBF0E6;
    --listo:#00BF6F;
    --listo-bg:#E3F8EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--marfil);
    font-family:'Raleway',sans-serif;
    color:var(--texto);
    line-height:1.5;
  }
  .wrap{max-width:1040px; margin:0 auto; padding:32px 20px 80px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:16px;}
  header .logo{display:block; max-width:140px;}
  .who{text-align:right;}
  .who .name{font-family:'Montserrat',sans-serif; font-weight:600; color:var(--profundo); font-size:14px;}
  .who .role{font-size:12px; color:var(--acento); text-transform:uppercase; letter-spacing:.5px;}

  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Montserrat',sans-serif;
    font-size:13px; font-weight:600;
    color:var(--profundo);
    background:none; border:none; cursor:pointer;
    padding:0; margin-bottom:18px;
    text-decoration:none;
  }
  .back-btn svg{width:16px; height:16px;}

  .topbar{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:22px;}
  .topbar h1{font-family:'Montserrat',sans-serif; font-size:20px; font-weight:600; color:var(--profundo); margin:0 0 4px;}
  .topbar p{margin:0; font-size:13px; color:var(--texto-suave);}
  .refresh-btn{
    font-family:'Montserrat',sans-serif; font-size:12px; font-weight:600;
    color:var(--profundo); background:none; border:1px solid var(--borde);
    border-radius:8px; padding:8px 14px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .refresh-btn:hover{background:var(--menta);}
  .refresh-btn svg{width:14px; height:14px;}

  .stat-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:26px;}
  .stat{background:#fff; border:1px solid var(--borde); border-radius:10px; padding:10px 16px; min-width:96px; text-align:center;}
  .stat .n{font-family:'Montserrat',sans-serif; font-size:19px; font-weight:700; color:var(--profundo);}
  .stat .l{font-size:10.5px; color:var(--texto-suave); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  .stat.warn .n{color:var(--alerta);}
  .stat.ok .n{color:var(--listo);}

  .filter-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px;}
  .filter-chip{
    display:flex; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--borde); border-radius:20px;
    padding:8px 16px; cursor:pointer;
    font-family:'Montserrat',sans-serif; font-size:12.5px; font-weight:600; color:var(--texto);
  }
  .filter-chip:hover{border-color:var(--acento);}
  .filter-chip .n{font-weight:700; color:var(--profundo);}
  .filter-chip.active{background:var(--profundo); border-color:var(--profundo); color:#fff;}
  .filter-chip.active .n{color:#fff;}

  .columns{display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start;}
  @media (max-width:820px){.columns{grid-template-columns:1fr;}}

  .col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .col-head h2{font-family:'Montserrat',sans-serif; font-size:14px; font-weight:600; color:var(--profundo); margin:0; display:flex; align-items:center; gap:8px;}
  .col-head .dot{width:8px; height:8px; border-radius:50%;}
  .col-head .count{font-size:11px; color:var(--texto-suave); background:var(--menta); padding:2px 8px; border-radius:20px; font-family:'Montserrat',sans-serif; font-weight:600;}

  .lead-card{background:#fff; border:1px solid var(--borde); border-radius:12px; padding:15px 16px; margin-bottom:12px;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .who-row{display:flex; gap:10px;}
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background:var(--menta); color:var(--medio);
    display:flex; align-items:center; justify-content:center;
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:13px;
    flex-shrink:0;
  }
  .who-text .name{font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px; color:var(--texto);}
  .who-text .meta{font-size:11.5px; color:var(--texto-suave); margin-top:1px;}

  .src-tag{font-size:10px; font-family:'Montserrat',sans-serif; font-weight:600; color:var(--medio); background:var(--menta); padding:3px 8px; border-radius:6px; white-space:nowrap;}

  .interes-tag{display:flex; align-items:flex-start; gap:5px; font-size:11.5px; color:var(--texto-suave); margin-top:10px;}
  .interes-tag i{width:13px; height:13px; color:var(--acento); flex-shrink:0; margin-top:1px;}
  .asesor-tag{font-size:11px; font-weight:700; color:var(--alerta); margin-top:2px;}
  .resumen-text{font-size:12px; color:var(--texto); line-height:1.5; margin:10px 0 0; background:var(--menta); border-radius:8px; padding:9px 11px;}

  .status-row{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .status-row .label{font-size:11.5px; color:var(--texto-suave); font-family:'Montserrat',sans-serif; font-weight:600;}
  .answer-badge{font-size:11px; font-weight:700; font-family:'Montserrat',sans-serif; padding:3px 10px; border-radius:20px;}
  .answer-badge.yes{background:var(--menta); color:var(--medio);}
  .answer-badge.no{background:var(--alerta-bg); color:var(--alerta);}
  .answer-badge.unknown{background:var(--menta); color:var(--texto-suave);}

  .actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .btn{
    flex:1; min-width:88px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 10px; border-radius:8px;
    font-family:'Montserrat',sans-serif; font-size:11.5px; font-weight:600;
    border:1px solid var(--borde); background:#fff; color:var(--texto);
    cursor:pointer; text-decoration:none;
  }
  .btn svg{width:14px; height:14px;}
  .btn.call{color:var(--profundo);}
  .btn.chat{background:var(--menta); border-color:var(--menta); color:var(--medio);}
  .btn.profile{background:var(--profundo); border-color:var(--profundo); color:#fff;}

  .method-row{display:flex; gap:8px; margin-top:8px;}
  .method-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    padding:8px; border-radius:8px;
    border:1px solid var(--menta); background:var(--menta); color:var(--medio);
    cursor:pointer;
  }
  .method-btn svg{width:15px; height:15px;}
  .method-btn.selected{background:var(--profundo); border-color:var(--profundo); color:#fff;}
  .btn:disabled{opacity:.5; cursor:default;}

  .empty-note{font-size:13px; color:var(--texto-suave); padding:16px; background:var(--menta); border-radius:8px; text-align:center;}
  .error-note{font-size:13px; color:#C0453A; padding:16px; background:#F5E4E1; border-radius:8px; text-align:center;}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(26,79,92,0.55); align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal-card{background:#fff; border-radius:12px; padding:24px; max-width:380px; width:100%; position:relative;}
  .modal-close{position:absolute; top:14px; right:14px; width:24px; height:24px; line-height:22px; text-align:center; border-radius:50%; border:none; background:rgba(26,79,92,0.1); color:var(--profundo); font-size:16px; cursor:pointer; padding:0;}
  .modal-close:hover{background:rgba(26,79,92,0.2);}
  .modal-card h3{font-family:'Montserrat',sans-serif; color:var(--profundo); font-size:17px; margin:0 0 16px;}
  .modal-card label{
    font-family:'Montserrat',sans-serif; font-size:12px; font-weight:600; color:var(--texto-suave);
    text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; display:block;
  }
  .modal-card input, .modal-card select{
    width:100%; font-family:'Raleway',sans-serif; font-size:14px; padding:10px 12px;
    border-radius:8px; border:1px solid var(--borde); background:#fff; color:var(--texto); margin-bottom:14px;
  }
  .modal-buttons{display:flex; gap:8px; margin-top:8px;}
  .modal-buttons button{flex:1; font-family:'Montserrat',sans-serif; font-size:14px; font-weight:600; padding:12px; border-radius:8px; border:none; cursor:pointer;}
  .modal-save{background:var(--profundo); color:#fff;}
  .modal-save:hover{background:var(--medio);}
  .modal-save:disabled{opacity:.6;}
  .modal-cancel{background:transparent; color:var(--texto-suave); border:1px solid var(--borde) !important;}
  .modal-error{color:#C0453A; font-size:12px; margin:-6px 0 12px; display:none;}
  .modal-success{color:var(--acento); font-size:12px; margin:-6px 0 12px; display:none;}

  .btn.danger{background:#F5E4E1; border-color:#F5E4E1; color:#C0453A; flex:1 1 100%; margin-top:8px;}
  .btn.danger:hover{background:#EFD3CE;}
  .btn.reactivar{background:var(--acento); border-color:var(--acento); color:#fff;}
  .btn.reactivar:hover{opacity:.9;}
  .btn.reactivar:disabled{opacity:.6; cursor:default;}

  .perdidos-search-wrap{margin-bottom:16px;}
  .perdidos-search-wrap input{
    width:100%; box-sizing:border-box; font-family:'Raleway',sans-serif; font-size:14px;
    padding:10px 12px; border-radius:8px; border:1px solid var(--borde); background:#fff; color:var(--texto);
  }

  .delete-reason-options{display:flex; flex-direction:column; gap:8px; margin-bottom:6px;}
  .delete-reason-btn{
    font-family:'Raleway',sans-serif;
    font-size:14px;
    text-align:left;
    padding:11px 14px;
    border-radius:8px;
    border:1px solid var(--borde);
    background:#fff;
    color:var(--texto);
    cursor:pointer;
  }
  .delete-reason-btn:hover{border-color:#C0453A; background:#F5E4E1;}

  .lost-reason{font-size:12px; color:var(--texto-suave); margin-top:10px; padding:9px 11px; background:#F5E4E1; border-radius:8px;}
  .lost-reason strong{color:#C0453A;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="LOGO_INMOBILIARIA_3.png" alt="Tres65 Inmobiliaria" class="logo">
    <div class="who">
      <div class="name" id="who-name">—</div>
      <div class="role" id="who-role">—</div>
    </div>
  </header>

  <a class="back-btn" href="agente-home.html">
    <i data-lucide="arrow-left"></i> Volver a home
  </a>

  <div class="topbar">
    <div>
      <h1 id="page-title">Leads del día</h1>
      <p id="page-subtitle">Sincronizado desde Chatwoot — labels "cliente-potencial" y "listo-para-asesor"</p>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="refresh-btn" id="round-robin-potencial-btn" type="button" style="display:none;"><i data-lucide="shuffle"></i> Round Robin Potencial</button>
      <button class="refresh-btn" id="round-robin-listo-btn" type="button" style="display:none;"><i data-lucide="shuffle"></i> Round Robin Listos</button>
      <button class="refresh-btn" id="view-toggle-btn" type="button"><i data-lucide="archive"></i> <span id="view-toggle-label">Ver leads perdidos</span></button>
      <button class="refresh-btn" id="refresh-btn" type="button"><i data-lucide="refresh-cw"></i> Actualizar</button>
    </div>
  </div>
  <div id="round-robin-status" style="display:none; margin-bottom:16px;" class="empty-note"></div>

  <div class="stat-row" id="stat-row" style="display:none;">
    <div class="stat"><div class="n" id="stat-total">0</div><div class="l">Total</div></div>
    <div class="stat"><div class="n" id="stat-potencial">0</div><div class="l">Potencial</div></div>
    <div class="stat ok"><div class="n" id="stat-listo">0</div><div class="l">Listos</div></div>
  </div>

  <div class="filter-row" id="filter-row" style="display:none;"></div>

  <h2 id="filter-title" style="font-family:'Montserrat',sans-serif; font-size:14px; font-weight:600; color:var(--profundo); margin:0 0 12px; display:none;"></h2>

  <div id="leads-status"></div>

  <div class="columns" id="columns" style="display:none;">
    <section>
      <div class="col-head">
        <h2><span class="dot" style="background:var(--alerta)"></span> Cliente potencial</h2>
        <span class="count" id="count-potencial">0</span>
      </div>
      <div id="col-potencial"></div>
    </section>
    <section>
      <div class="col-head">
        <h2><span class="dot" style="background:var(--listo)"></span> Listo para asesor</h2>
        <span class="count" id="count-listo">0</span>
      </div>
      <div id="col-listo"></div>
    </section>
  </div>

  <div class="perdidos-search-wrap" id="perdidos-search-wrap" style="display:none;">
    <input type="text" id="perdidos-search-input" placeholder="Buscar por nombre...">
  </div>
  <div id="perdidos-list" style="display:none;"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-card">
    <button class="modal-close" id="modal-close-x" type="button" aria-label="Cerrar">×</button>
    <h3>Crear portal para este cliente</h3>
    <div id="agent-select-wrap" style="display:none;">
      <label for="agent-select">Asignar a</label>
      <select id="agent-select"></select>
    </div>
    <label for="client-name">Nombre completo</label>
    <input type="text" id="client-name" placeholder="Nombre del cliente">
    <label for="client-phone">Teléfono</label>
    <input type="text" id="client-phone" placeholder="9991234567">
    <label for="client-email">Correo (opcional)</label>
    <input type="email" id="client-email" placeholder="cliente@correo.com">
    <label for="client-property">Link de la propiedad (opcional)</label>
    <input type="text" id="client-property" placeholder="https://...">
    <p class="modal-error" id="modal-error"></p>
    <div id="modal-success-wrap" style="display:none; margin-bottom:14px;">
      <p class="modal-success" style="display:block;">Cliente creado.</p>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <a id="modal-success-link" href="#" target="_blank" rel="noopener" style="font-size:12px; color:var(--acento); word-break:break-all; flex:1; min-width:0;"></a>
        <button id="modal-copy-link" type="button" style="font-family:'Montserrat',sans-serif; font-size:12px; font-weight:600; padding:8px 12px; border-radius:8px; border:1px solid var(--borde); background:#fff; color:var(--texto); cursor:pointer; white-space:nowrap;">Copiar link</button>
        <button id="modal-send-welcome" type="button" style="font-family:'Montserrat',sans-serif; font-size:12px; font-weight:600; padding:8px 12px; border-radius:8px; border:none; background:var(--profundo); color:#fff; cursor:pointer; white-space:nowrap;">Enviar a cliente</button>
      </div>
      <p class="modal-success" id="modal-send-status" style="display:none; margin-top:6px;"></p>
    </div>
    <div class="modal-buttons" id="modal-buttons-default">
      <button class="modal-cancel" id="modal-cancel" type="button">Cancelar</button>
      <button class="modal-save" id="modal-save" type="button">Crear</button>
    </div>
    <div class="modal-buttons" id="modal-buttons-success" style="display:none;">
      <button class="modal-save" id="modal-close-success" type="button">Cerrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="delete-modal">
  <div class="modal-card">
    <button class="modal-close" id="delete-modal-close-x" type="button" aria-label="Cerrar">×</button>
    <h3 id="delete-modal-title">¿Por qué se pierde este lead?</h3>
    <div class="delete-reason-options" id="delete-reason-options">
      <button class="delete-reason-btn" data-reason="Nunca contestó" type="button">Nunca contestó</button>
      <button class="delete-reason-btn" data-reason="Se fue con otro agente" type="button">Se fue con otro agente</button>
      <button class="delete-reason-btn" data-reason="Ya no está interesado" type="button">Ya no está interesado</button>
      <button class="delete-reason-btn" id="delete-reason-other-btn" type="button">Otra razón</button>
    </div>
    <div id="delete-reason-other-wrap" style="display:none; margin-top:4px;">
      <label for="delete-reason-other-input">Explica la razón</label>
      <input type="text" id="delete-reason-other-input" placeholder="Ej: cambió de ciudad">
    </div>
    <p class="modal-error" id="delete-modal-error"></p>
    <div class="modal-buttons">
      <button class="modal-cancel" id="delete-modal-cancel" type="button">Cancelar</button>
      <button class="modal-save" id="delete-reason-other-confirm" type="button" style="display:none;">Confirmar</button>
    </div>
  </div>
</div>

<script>
const AGENTS = [
  {uid:'5219992786153', name:'Damara Traconis Corres'},
  {uid:'5219992399890', name:'Moises Traconis Corres'},
  {uid:'5219992413657', name:'Guillermo Martínez Espinosa'}
];

function waitForSync(){
  return new Promise(resolve=>{
    if(window.tres65Sync){ resolve(); return; }
    window.addEventListener('tres65-sync-ready', () => resolve(), {once:true});
  });
}

function initials(name){
  return (name || '?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function timeAgo(epochSeconds){
  if(!epochSeconds) return '';
  const diffMs = Date.now() - (epochSeconds * 1000);
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'ahora mismo';
  if(mins < 60) return 'hace ' + mins + ' min';
  const hours = Math.floor(mins / 60);
  if(hours < 24) return 'hace ' + hours + 'h';
  const days = Math.floor(hours / 24);
  return 'hace ' + days + 'd';
}

let session = null;

function buildLeadCard(lead){
  const card = document.createElement('div');
  card.className = 'lead-card';

  const top = document.createElement('div');
  top.className = 'card-top';
  const who = document.createElement('div');
  who.className = 'who-row';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = initials(lead.name);
  who.appendChild(avatar);
  const whoText = document.createElement('div');
  whoText.className = 'who-text';
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = lead.name || 'Sin nombre';
  whoText.appendChild(name);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = [lead.phone, timeAgo(lead.last_activity)].filter(Boolean).join(' · ');
  whoText.appendChild(meta);
  if(lead.posible_asesor){
    const asesorTag = document.createElement('div');
    asesorTag.className = 'asesor-tag';
    asesorTag.textContent = 'Posible asesor inmobiliario';
    whoText.appendChild(asesorTag);
  }
  who.appendChild(whoText);
  top.appendChild(who);

  const src = document.createElement('span');
  src.className = 'src-tag';
  src.textContent = lead.origen || 'Link directo';
  top.appendChild(src);
  card.appendChild(top);

  if(lead.interes){
    const interes = document.createElement('div');
    interes.className = 'interes-tag';
    interes.innerHTML = '<i data-lucide="map-pin"></i> <span></span>';
    interes.querySelector('span').textContent = lead.interes;
    card.appendChild(interes);
  }

  if(lead.resumen){
    const resumen = document.createElement('p');
    resumen.className = 'resumen-text';
    resumen.textContent = lead.resumen;
    card.appendChild(resumen);
  }

  const attempts = lead.contact_attempts || [];
  attempts.forEach(att=>{
    const statusRow = document.createElement('div');
    statusRow.className = 'status-row';
    const statusLabel = document.createElement('span');
    statusLabel.className = 'label';
    statusLabel.textContent = 'Contacto ' + att.attempt_number + (att.method ? ' (' + att.method + '):' : ':');
    statusRow.appendChild(statusLabel);
    const badge = document.createElement('span');
    badge.className = 'answer-badge ' + (att.contacted ? 'yes' : 'no');
    badge.textContent = att.contacted ? (att.result || 'Contestó') : 'Sin respuesta';
    statusRow.appendChild(badge);
    card.appendChild(statusRow);
  });

  const actions = document.createElement('div');
  actions.className = 'actions';

  if(lead.phone){
    const callBtn = document.createElement('a');
    callBtn.className = 'btn call';
    callBtn.href = 'tel:' + lead.phone;
    callBtn.innerHTML = '<i data-lucide="phone"></i> Llamar';
    actions.appendChild(callBtn);
  }

  const chatBtn = document.createElement('a');
  chatBtn.className = 'btn call';
  chatBtn.href = lead.chatwoot_url;
  chatBtn.target = '_blank';
  chatBtn.rel = 'noopener';
  chatBtn.innerHTML = '<i data-lucide="message-square"></i> Chatwoot';
  actions.appendChild(chatBtn);

  if(lead.label === 'cliente-potencial'){
    const convertBtn = document.createElement('button');
    convertBtn.className = 'btn profile';
    convertBtn.type = 'button';
    convertBtn.innerHTML = '<i data-lucide="arrow-up-circle"></i> Convertir a listo';
    convertBtn.addEventListener('click', async ()=>{
      const original = convertBtn.innerHTML;
      convertBtn.disabled = true;
      convertBtn.textContent = 'Convirtiendo...';
      try{
        await window.tres65Sync.convertLeadToListo(lead.conv_id);
        await loadLeads();
      }catch(err){
        alert(err.message || 'Error convirtiendo el lead.');
        convertBtn.disabled = false;
        convertBtn.innerHTML = original;
      }
    });
    actions.appendChild(convertBtn);
  } else if(lead.assignee_uid){
    const profileBtn = document.createElement('button');
    profileBtn.className = 'btn profile';
    profileBtn.type = 'button';
    profileBtn.innerHTML = '<i data-lucide="user-plus"></i> Crear portal';
    profileBtn.addEventListener('click', ()=> openCreateModal(lead));
    actions.appendChild(profileBtn);
  }

  const nextAttemptNum = attempts.length + 1;
  let selectedMethod = null;

  const methodRow = document.createElement('div');
  methodRow.className = 'method-row';
  const METHODS = [['Llamada', 'phone'], ['WhatsApp', 'message-circle'], ['Chatwoot', 'message-square'], ['Email', 'mail']];
  const methodBtns = METHODS.map(([label, icon])=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'method-btn';
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.innerHTML = '<i data-lucide="' + icon + '"></i>';
    btn.addEventListener('click', ()=>{
      selectedMethod = label;
      methodBtns.forEach(b => b.classList.toggle('selected', b === btn));
      noAnswerBtn.disabled = false;
      answeredBtn.disabled = false;
    });
    methodRow.appendChild(btn);
    return btn;
  });

  const contactRow = document.createElement('div');
  contactRow.className = 'actions';
  contactRow.style.marginTop = '8px';

  const noAnswerBtn = document.createElement('button');
  noAnswerBtn.className = 'btn';
  noAnswerBtn.type = 'button';
  noAnswerBtn.disabled = true;
  noAnswerBtn.innerHTML = '<i data-lucide="phone-missed"></i> Contacto ' + nextAttemptNum + ': No contestó';
  noAnswerBtn.addEventListener('click', async ()=>{
    if(!selectedMethod) return;
    noAnswerBtn.disabled = true;
    try{
      await window.tres65Sync.logLeadContact(lead.conv_id, false, '', selectedMethod);
      await loadLeads();
    }catch(err){
      alert(err.message || 'Error registrando el contacto.');
      noAnswerBtn.disabled = false;
    }
  });
  contactRow.appendChild(noAnswerBtn);

  const answeredBtn = document.createElement('button');
  answeredBtn.className = 'btn';
  answeredBtn.type = 'button';
  answeredBtn.disabled = true;
  answeredBtn.innerHTML = '<i data-lucide="phone-call"></i> Contacto ' + nextAttemptNum + ': Sí contestó';
  answeredBtn.addEventListener('click', async ()=>{
    if(!selectedMethod) return;
    const result = prompt('¿Qué resultó del contacto?', '');
    if(result === null) return;
    answeredBtn.disabled = true;
    try{
      await window.tres65Sync.logLeadContact(lead.conv_id, true, result.trim(), selectedMethod);
      await loadLeads();
    }catch(err){
      alert(err.message || 'Error registrando el contacto.');
      answeredBtn.disabled = false;
    }
  });
  contactRow.appendChild(answeredBtn);

  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'btn danger';
  deleteBtn.type = 'button';
  deleteBtn.innerHTML = '<i data-lucide="trash-2"></i> Borrar lead';
  deleteBtn.addEventListener('click', ()=>{
    openDeleteReasonModal(lead.name, async (reason)=>{
      await window.tres65Sync.deleteLead(lead.conv_id, reason);
      await loadLeads();
    });
  });

  card.appendChild(actions);
  card.appendChild(contactRow);
  card.appendChild(methodRow);
  card.appendChild(deleteBtn);
  return card;
}

let deleteReasonCallback = null;

function openDeleteReasonModal(leadName, onConfirm){
  deleteReasonCallback = onConfirm;
  document.getElementById('delete-modal-title').textContent = '¿Por qué se pierde ' + (leadName && leadName !== 'Por definir' ? leadName : 'este lead') + '?';
  document.getElementById('delete-reason-options').style.display = 'flex';
  document.getElementById('delete-reason-other-wrap').style.display = 'none';
  document.getElementById('delete-reason-other-input').value = '';
  document.getElementById('delete-reason-other-confirm').style.display = 'none';
  document.getElementById('delete-modal-error').style.display = 'none';
  document.getElementById('delete-modal').classList.add('open');
}

function openCreateModal(lead){
  document.getElementById('client-name').value = (lead.name && lead.name !== 'Por definir') ? lead.name : '';
  document.getElementById('client-phone').value = (lead.phone || '').replace(/\D/g, '');
  document.getElementById('client-email').value = lead.email || '';
  document.getElementById('client-property').value = '';
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-success-wrap').style.display = 'none';
  document.getElementById('modal-send-status').style.display = 'none';
  document.getElementById('modal-buttons-default').style.display = 'flex';
  document.getElementById('modal-buttons-success').style.display = 'none';
  if(session.isAdmin && lead.assignee_uid){
    document.getElementById('agent-select').value = lead.assignee_uid;
  }
  document.getElementById('modal').classList.add('open');
}

let allLeads = [];
let currentFilter = 'unassigned';
let currentView = 'activos';

function leadsForFilter(filter){
  if(filter === 'unassigned') return allLeads.filter(l => !l.assignee_uid);
  return allLeads.filter(l => l.assignee_uid === filter);
}

function renderFilters(){
  const row = document.getElementById('filter-row');
  if(!session.isAdmin){
    row.style.display = 'none';
    return;
  }
  row.innerHTML = '';
  const options = [{key: 'unassigned', label: 'Sin asignar'}].concat(
    AGENTS.map(a => ({key: a.uid, label: a.name.split(' ')[0]}))
  );
  options.forEach(opt=>{
    const count = leadsForFilter(opt.key).length;
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'filter-chip' + (currentFilter === opt.key ? ' active' : '');
    chip.innerHTML = '<span class="n">' + count + '</span> ' + (opt.key === 'unassigned' ? opt.label : 'Asignados ' + opt.label);
    chip.addEventListener('click', ()=>{
      currentFilter = opt.key;
      renderFilters();
      renderColumns();
    });
    row.appendChild(chip);
  });
  row.style.display = 'flex';
}

function renderColumns(){
  const columnsEl = document.getElementById('columns');
  const statRow = document.getElementById('stat-row');
  const filterTitle = document.getElementById('filter-title');
  const leads = session.isAdmin ? leadsForFilter(currentFilter) : allLeads;

  const potenciales = leads.filter(l => l.label === 'cliente-potencial');
  const listos = leads.filter(l => l.label === 'listo-para-asesor');

  document.getElementById('stat-total').textContent = leads.length;
  document.getElementById('stat-potencial').textContent = potenciales.length;
  document.getElementById('stat-listo').textContent = listos.length;
  statRow.style.display = 'flex';

  if(session.isAdmin){
    const opt = [{key:'unassigned', label:'Leads sin asignar'}].concat(AGENTS.map(a=>({key:a.uid, label:'Asignados a ' + a.name})))
      .find(o => o.key === currentFilter);
    filterTitle.textContent = opt ? opt.label : '';
    filterTitle.style.display = 'block';
  } else {
    filterTitle.style.display = 'none';
  }

  const colPotencial = document.getElementById('col-potencial');
  const colListo = document.getElementById('col-listo');
  colPotencial.innerHTML = '';
  colListo.innerHTML = '';
  document.getElementById('count-potencial').textContent = potenciales.length;
  document.getElementById('count-listo').textContent = listos.length;

  if(!potenciales.length){
    colPotencial.innerHTML = '<p class="empty-note">Sin leads potenciales por ahora.</p>';
  } else {
    potenciales.forEach(l => colPotencial.appendChild(buildLeadCard(l)));
  }
  if(!listos.length){
    colListo.innerHTML = '<p class="empty-note">Sin leads listos para asesor por ahora.</p>';
  } else {
    listos.forEach(l => colListo.appendChild(buildLeadCard(l)));
  }

  columnsEl.style.display = 'grid';
  if(window.lucide) lucide.createIcons();
}

function buildLostLeadCard(lead){
  const card = document.createElement('div');
  card.className = 'lead-card';

  const top = document.createElement('div');
  top.className = 'card-top';
  const who = document.createElement('div');
  who.className = 'who-row';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = initials(lead.name);
  who.appendChild(avatar);
  const whoText = document.createElement('div');
  whoText.className = 'who-text';
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = lead.name || 'Sin nombre';
  whoText.appendChild(name);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = [lead.phone, lead.assignee_name].filter(Boolean).join(' · ');
  whoText.appendChild(meta);
  who.appendChild(whoText);
  top.appendChild(who);
  card.appendChild(top);

  if(lead.interes){
    const interes = document.createElement('div');
    interes.className = 'interes-tag';
    interes.innerHTML = '<i data-lucide="map-pin"></i> <span></span>';
    interes.querySelector('span').textContent = lead.interes;
    card.appendChild(interes);
  }

  const info = lead.deleted_info || {};
  const reasonBox = document.createElement('div');
  reasonBox.className = 'lost-reason';
  const reasonLine = document.createElement('div');
  reasonLine.innerHTML = '<strong>Razón:</strong> ';
  reasonLine.appendChild(document.createTextNode(info.reason || 'Sin razón registrada'));
  reasonBox.appendChild(reasonLine);
  if(info.deleted_by || info.deleted_at){
    const byLine = document.createElement('div');
    byLine.style.marginTop = '4px';
    byLine.textContent = [info.deleted_by, info.deleted_at ? new Date(info.deleted_at).toLocaleString('es-MX', {dateStyle:'medium', timeStyle:'short'}) : ''].filter(Boolean).join(' — ');
    reasonBox.appendChild(byLine);
  }
  card.appendChild(reasonBox);

  const actions = document.createElement('div');
  actions.className = 'actions';
  const chatBtn = document.createElement('a');
  chatBtn.className = 'btn chat';
  chatBtn.href = lead.chatwoot_url;
  chatBtn.target = '_blank';
  chatBtn.rel = 'noopener';
  chatBtn.innerHTML = '<i data-lucide="message-square"></i> Chatwoot';
  actions.appendChild(chatBtn);

  const reactivarBtn = document.createElement('button');
  reactivarBtn.type = 'button';
  reactivarBtn.className = 'btn reactivar';
  reactivarBtn.innerHTML = '<i data-lucide="rotate-ccw"></i> Reactivar';
  reactivarBtn.onclick = async ()=>{
    reactivarBtn.disabled = true;
    reactivarBtn.innerHTML = 'Reactivando...';
    try{
      await window.tres65Sync.reactivarLead(lead.conv_id);
      perdidosCache = perdidosCache.filter(l => l.conv_id !== lead.conv_id);
      renderPerdidos(filterPerdidos(perdidosCache));
    }catch(err){
      alert(err.message || 'Error reactivando el lead.');
      reactivarBtn.disabled = false;
      reactivarBtn.innerHTML = '<i data-lucide="rotate-ccw"></i> Reactivar';
      if(window.lucide) lucide.createIcons();
    }
  };
  actions.appendChild(reactivarBtn);

  card.appendChild(actions);

  return card;
}

let perdidosCache = [];

function filterPerdidos(leads){
  const q = (document.getElementById('perdidos-search-input').value || '').trim().toLowerCase();
  if(!q) return leads;
  return leads.filter(l => (l.name || '').toLowerCase().includes(q));
}

function renderPerdidos(leads){
  const listEl = document.getElementById('perdidos-list');
  listEl.innerHTML = '';
  if(!leads.length){
    listEl.innerHTML = '<p class="empty-note">No hay leads perdidos.</p>';
  } else {
    leads.forEach(l => listEl.appendChild(buildLostLeadCard(l)));
  }
  listEl.style.display = 'block';
  if(window.lucide) lucide.createIcons();
}

function setView(view){
  currentView = view;
  const title = document.getElementById('page-title');
  const subtitle = document.getElementById('page-subtitle');
  const label = document.getElementById('view-toggle-label');
  if(view === 'perdidos'){
    title.textContent = 'Leads perdidos';
    subtitle.textContent = 'Leads marcados como perdidos, con la razón por la que ya no se siguieron.';
    label.textContent = 'Ver leads activos';
  } else {
    title.textContent = 'Leads del día';
    subtitle.textContent = 'Sincronizado desde Chatwoot — labels "cliente-potencial" y "listo-para-asesor"';
    label.textContent = 'Ver leads perdidos';
  }
  document.getElementById('round-robin-potencial-btn').style.display = (view === 'activos' && session.isAdmin) ? 'inline-flex' : 'none';
  document.getElementById('round-robin-listo-btn').style.display = (view === 'activos' && session.isAdmin) ? 'inline-flex' : 'none';
  document.getElementById('perdidos-search-wrap').style.display = (view === 'perdidos') ? 'block' : 'none';
}

async function loadLeads(){
  const statusEl = document.getElementById('leads-status');
  const columnsEl = document.getElementById('columns');
  const statRow = document.getElementById('stat-row');
  const filterRow = document.getElementById('filter-row');
  const filterTitle = document.getElementById('filter-title');
  const perdidosList = document.getElementById('perdidos-list');
  statusEl.innerHTML = '<p class="empty-note">Consultando Chatwoot...</p>';
  columnsEl.style.display = 'none';
  statRow.style.display = 'none';
  filterRow.style.display = 'none';
  filterTitle.style.display = 'none';
  perdidosList.style.display = 'none';

  try{
    if(currentView === 'perdidos'){
      perdidosCache = await window.tres65Sync.getLeadsPerdidos();
      statusEl.innerHTML = '';
      renderPerdidos(filterPerdidos(perdidosCache));
    } else {
      allLeads = await window.tres65Sync.getLeadsPotenciales();
      statusEl.innerHTML = '';
      renderFilters();
      renderColumns();
    }
  }catch(err){
    console.error('[Leads] error:', err);
    statusEl.innerHTML = '<p class="error-note">' + (err.message || 'Error consultando Chatwoot.') + '</p>';
  }
}

async function boot(){
  await waitForSync();
  session = await window.tres65Sync.agentInit();
  if(!session){
    window.location.href = 'agente-login.html';
    return;
  }
  document.getElementById('who-name').textContent = session.email;
  document.getElementById('who-role').textContent = session.isAdmin ? 'Admin' : 'Agente';

  if(session.isAdmin){
    const wrap = document.getElementById('agent-select-wrap');
    wrap.style.display = 'block';
    const select = document.getElementById('agent-select');
    AGENTS.forEach(a=>{
      const opt = document.createElement('option');
      opt.value = a.uid;
      opt.textContent = a.name;
      select.appendChild(opt);
    });
  }

  const initialView = new URLSearchParams(window.location.search).get('view') === 'perdidos' ? 'perdidos' : 'activos';
  setView(initialView);

  await loadLeads();
  if(window.lucide) lucide.createIcons();

  document.getElementById('refresh-btn').addEventListener('click', loadLeads);

  document.getElementById('view-toggle-btn').addEventListener('click', async ()=>{
    setView(currentView === 'perdidos' ? 'activos' : 'perdidos');
    await loadLeads();
    if(window.lucide) lucide.createIcons();
  });

  document.getElementById('perdidos-search-input').addEventListener('input', ()=>{
    renderPerdidos(filterPerdidos(perdidosCache));
  });

  function wireRoundRobinBtn(btnId, label, statusLabel){
    document.getElementById(btnId).addEventListener('click', async ()=>{
      const btn = document.getElementById(btnId);
      const status = document.getElementById('round-robin-status');
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'Repartiendo...';
      status.style.display = 'none';
      try{
        const result = await window.tres65Sync.runLeadsRoundRobin(label);
        const a = result.asignados || {};
        status.className = 'empty-note';
        status.textContent = 'Repartidos: ' + (a[label] || 0) + ' ' + statusLabel + '.';
        status.style.display = 'block';
        await loadLeads();
      }catch(err){
        status.className = 'error-note';
        status.textContent = err.message || 'Error repartiendo los leads.';
        status.style.display = 'block';
      }finally{
        btn.disabled = false;
        btn.innerHTML = original;
        if(window.lucide) lucide.createIcons();
      }
    });
  }
  wireRoundRobinBtn('round-robin-potencial-btn', 'cliente-potencial', 'cliente(s) potencial(es)');
  wireRoundRobinBtn('round-robin-listo-btn', 'listo-para-asesor', 'listo(s) para asesor');

  document.getElementById('modal-close-x').addEventListener('click', ()=>{
    document.getElementById('modal').classList.remove('open');
  });

  document.getElementById('modal-cancel').addEventListener('click', ()=>{
    document.getElementById('modal').classList.remove('open');
  });
  document.getElementById('modal-close-success').addEventListener('click', ()=>{
    document.getElementById('modal').classList.remove('open');
  });

  document.getElementById('delete-modal-close-x').addEventListener('click', ()=>{
    document.getElementById('delete-modal').classList.remove('open');
    deleteReasonCallback = null;
  });
  document.getElementById('delete-modal-cancel').addEventListener('click', ()=>{
    document.getElementById('delete-modal').classList.remove('open');
    deleteReasonCallback = null;
  });

  async function submitDeleteReason(reason){
    const errorNote = document.getElementById('delete-modal-error');
    errorNote.style.display = 'none';
    if(!deleteReasonCallback) return;
    try{
      await deleteReasonCallback(reason);
      document.getElementById('delete-modal').classList.remove('open');
      deleteReasonCallback = null;
    }catch(err){
      errorNote.textContent = err.message || 'Error borrando el lead.';
      errorNote.style.display = 'block';
    }
  }
  document.querySelectorAll('#delete-reason-options .delete-reason-btn[data-reason]').forEach(btn=>{
    btn.addEventListener('click', ()=> submitDeleteReason(btn.dataset.reason));
  });
  document.getElementById('delete-reason-other-btn').addEventListener('click', ()=>{
    document.getElementById('delete-reason-options').style.display = 'none';
    document.getElementById('delete-reason-other-wrap').style.display = 'block';
    document.getElementById('delete-reason-other-confirm').style.display = 'block';
  });
  document.getElementById('delete-reason-other-confirm').addEventListener('click', ()=>{
    const reason = document.getElementById('delete-reason-other-input').value.trim();
    if(!reason) return;
    submitDeleteReason(reason);
  });
  submitOnEnter('delete-reason-other-input', 'delete-reason-other-confirm');

  document.getElementById('modal-copy-link').addEventListener('click', async ()=>{
    const btn = document.getElementById('modal-copy-link');
    const link = document.getElementById('modal-success-link').href;
    try{
      await navigator.clipboard.writeText(link);
      const original = btn.textContent;
      btn.textContent = '¡Copiado!';
      setTimeout(()=>{ btn.textContent = original; }, 1500);
    }catch(err){
      prompt('Copia el link:', link);
    }
  });

  document.getElementById('modal-send-welcome').addEventListener('click', async ()=>{
    const btn = document.getElementById('modal-send-welcome');
    const status = document.getElementById('modal-send-status');
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    status.style.display = 'none';
    try{
      await window.tres65Sync.sendWelcomeMessage(btn.dataset.token);
      status.className = 'modal-success';
      status.textContent = '¡Mensaje enviado!';
      status.style.display = 'block';
    }catch(err){
      status.className = 'modal-error';
      status.textContent = err.message || 'No se pudo enviar (revisa si el template ya está aprobado).';
      status.style.display = 'block';
    }finally{
      btn.disabled = false;
      btn.textContent = original;
    }
  });

  document.getElementById('modal-save').addEventListener('click', async ()=>{
    const btn = document.getElementById('modal-save');
    const errorNote = document.getElementById('modal-error');
    const successWrap = document.getElementById('modal-success-wrap');
    errorNote.style.display = 'none';
    successWrap.style.display = 'none';

    const client_name = document.getElementById('client-name').value.trim();
    const client_phone = document.getElementById('client-phone').value.trim();
    const client_email = document.getElementById('client-email').value.trim();
    const property_raw = document.getElementById('client-property').value.trim();
    const agent_uid = session.isAdmin ? document.getElementById('agent-select').value : undefined;

    if(!client_name || !client_phone){
      errorNote.textContent = 'Falta el nombre o el teléfono.';
      errorNote.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creando...';
    try{
      const result = await window.tres65Sync.createClient({client_name, client_phone, client_email, property_raw, agent_uid});
      const linkEl = document.getElementById('modal-success-link');
      linkEl.href = result.link;
      linkEl.textContent = result.link;
      document.getElementById('modal-send-welcome').dataset.token = result.ficha.token;
      document.getElementById('modal-send-status').style.display = 'none';
      successWrap.style.display = 'block';
      document.getElementById('modal-buttons-default').style.display = 'none';
      document.getElementById('modal-buttons-success').style.display = 'flex';
    }catch(err){
      console.error('[Leads] error creando cliente:', err);
      errorNote.textContent = err.message || 'Error creando el portal.';
      errorNote.style.display = 'block';
    }finally{
      btn.disabled = false;
      btn.textContent = 'Crear';
    }
  });

  function submitOnEnter(inputId, btnId, {allowNewline} = {}){
    document.getElementById(inputId).addEventListener('keydown', (e)=>{
      if(e.key !== 'Enter') return;
      if(allowNewline && e.shiftKey) return;
      e.preventDefault();
      document.getElementById(btnId).click();
    });
  }
  submitOnEnter('client-name', 'modal-save');
  submitOnEnter('client-phone', 'modal-save');
  submitOnEnter('client-email', 'modal-save');
  submitOnEnter('client-property', 'modal-save');
}

boot();
</script>
</body>
</html>
